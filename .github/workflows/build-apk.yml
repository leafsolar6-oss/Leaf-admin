name: Build Debug APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare standard layout
        run: |
          mkdir -p app/src/main/java/ng/leafsolar/admin app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cp app-build.gradle app/build.gradle
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.kt app/src/main/java/ng/leafsolar/admin/
          cp colors.xml strings.xml themes.xml app/src/main/res/values/
          cp ic_leaf.xml app/src/main/res/drawable/
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
