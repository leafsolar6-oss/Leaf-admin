name: Build App
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare standard layout
        run: |
          mkdir -p app/src/main/java/ng/leafsolar/admin app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          cp app-build.gradle app/build.gradle
          cp google-services.json app/google-services.json
          cp upload-keystore.jks app/upload-keystore.jks
          cp AndroidManifest.xml app/src/main/
          cp MainActivity.kt FcmService.kt PushStore.kt FcmInit.kt app/src/main/java/ng/leafsolar/admin/
          cp colors.xml strings.xml themes.xml app/src/main/res/values/
          cp ic_leaf.xml app/src/main/res/drawable/
          cp ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/
      - name: Build debug + release
        run: chmod +x gradlew && ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-Admin-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-Admin-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-Admin-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
