plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'com.google.gms.google-services' }
android {
  namespace 'ng.leafsolar.admin'
  compileSdk 34
  defaultConfig { applicationId "ng.leafsolar.admin"; minSdk 24; targetSdk 34; versionCode 17; versionName "2.9" }
  buildFeatures { compose true; buildConfig true }
  composeOptions { kotlinCompilerExtensionVersion '1.5.14' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget='17' }
  buildTypes {
    release {
      minifyEnabled false
      // Signed with the debug key for sideload/distribution. For Play Store, re-sign with your upload key.
      signingConfig signingConfigs.debug
    }
  }
}
dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'androidx.activity:activity-compose:1.9.1'
  implementation platform('androidx.compose:compose-bom:2024.06.00')
  implementation 'androidx.compose.ui:ui'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
  implementation 'com.google.android.material:material:1.12.0'
  implementation platform('com.google.firebase:firebase-bom:33.1.2')
  implementation 'com.google.firebase:firebase-messaging-ktx'
  implementation 'com.google.firebase:firebase-analytics-ktx'
  implementation 'io.coil-kt:coil-compose:2.6.0'
  implementation 'com.google.accompanist:accompanist-swiperefresh:0.34.0'
}
